[project]
name = "sphinxjp.themes.impressjs"
version = "0.5.0"
description = "Impress.js presentation style theme for Sphinx."
readme = "README.rst"
authors = [
    { name = "shkumagai", email = "take.this.2.your.grave@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE", "AUTHORS.txt"]
requires-python = ">=3.11,<3.16"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Theme",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "Sphinx>7.1",
]

[project.urls]
Homepage = "https://github.com/shkumagai/sphinxjp.themes.impressjs"

[dependency-groups]
dev = [
    "nox>=2025.11.12",
]

[tool.uv.build-backend]
module-name = "sphinxjp"
source-include = ["AUTHORS.txt", "HISTORY.txt"]

[tool.ruff]
select = ["E", "F", "COM", "RET502", "RET503", "T20"]
ignore = [
    "E203",   # Whitespace before '{symbol}'
    "E501",   # Line too long ({width} > {limit})
    "E722",   # Do not use bare except
]

target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"

[tool.mypy]
strict_optional = true
ignore_missing_imports = true
check_untyped_defs = true
warn_no_return = false
show_traceback = true
allow_redefinition = true
incremental = true

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
